<!DOCTYPE html>
<html>
<head>
<title>React Contact Form</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #fef3c7;
}

.container {
    width: 400px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px gray;
}

h1 {
    text-align: center;
    color: #d97706;
}

.field {
    margin-bottom: 15px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

input, textarea {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
}

textarea {
    height: 100px;
}

button {
    width: 100%;
    padding: 12px;
    background: #d97706;
    color: white;
    border: none;
}

.error {
    color: red;
    text-align: center;
    margin-top: 15px;
}

.success {
    color: green;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function TextInput({ label, value, onChange, placeholder }) {
    return (
        <div className="field">
            <label>{label}</label>

            <input
                type="text"
                value={value}
                onChange={onChange}
                placeholder={placeholder}
            />
        </div>
    );
}

function MessageBox({ value, onChange }) {
    return (
        <div className="field">

            <label>Message</label>

            <textarea
                value={value}
                onChange={onChange}
                placeholder="Enter your message"
            />

        </div>
    );
}

function ContactForm() {

    const [name, setName] = React.useState("");
    const [email, setEmail] = React.useState("");
    const [message, setMessage] = React.useState("");
    const [result, setResult] = React.useState("");

    function handleSubmit(event) {

        event.preventDefault();

        if (name === "" || email === "" || message === "") {
            setResult("Please fill all fields");
        }
        else if (!email.includes("@")) {
            setResult("Please enter a valid email");
        }
        else {
            setResult("Message sent successfully!");
        }
    }

    return (
        <div className="container">

            <h1>Contact Us</h1>

            <form onSubmit={handleSubmit}>

                <TextInput
                    label="Name"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Enter your name"
                />

                <TextInput
                    label="Email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="Enter your email"
                />

                <MessageBox
                    value={message}
                    onChange={(e) => setMessage(e.target.value)}
                />

                <button type="submit">
                    Send Message
                </button>

            </form>

            {result && (
                <div className={
                    result.includes("successfully")
                    ? "success"
                    : "error"
                }>
                    {result}
                </div>
            )}

        </div>
    );
}

function App() {
    return <ContactForm />;
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
