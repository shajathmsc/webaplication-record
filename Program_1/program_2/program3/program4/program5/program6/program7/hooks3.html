<!DOCTYPE html>
<html>
<head>
<title>React To-Do List</title>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
body {
    font-family: Arial;
    background: #fff7ed;
}

.container {
    width: 400px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px gray;
}

h1 {
    text-align: center;
    color: #ea580c;
}

input {
    width: 70%;
    padding: 10px;
}

button {
    padding: 10px;
    background: #ea580c;
    color: white;
    border: none;
}

li {
    margin: 12px 0;
    padding: 8px;
    background: #fef3c7;
}

.delete {
    float: right;
    background: red;
}
</style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

function TodoList() {

    const [task, setTask] = React.useState("");
    const [tasks, setTasks] = React.useState([]);

    function addTask() {

        if (task.trim() === "")
            return;

        setTasks([...tasks, task]);
        setTask("");
    }

    function deleteTask(index) {

        const newTasks = tasks.filter(
            (_, i) => i !== index
        );

        setTasks(newTasks);
    }

    return (
        <div className="container">

            <h1>To-Do List</h1>

            <input
                type="text"
                value={task}
                onChange={(e) => setTask(e.target.value)}
                placeholder="Enter a task"
            />

            <button onClick={addTask}>
                Add
            </button>

            <ul>

                {tasks.map((item, index) => (

                    <li key={index}>

                        {item}

                        <button
                            className="delete"
                            onClick={() => deleteTask(index)}
                        >
                            Delete
                        </button>

                    </li>

                ))}

            </ul>

        </div>
    );
}

function App() {
    return <TodoList />;
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
